<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Harshan Rasu</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050608;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-h: 100vh;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,92,0,0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 3rem 2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 6rem;
      font-weight: 800;
      color: #FF5C00;
      line-height: 1;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px rgba(255, 92, 0, 0.5);
    }
    .title {
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
    }
    .desc {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 2rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      background: #FF5C00;
      color: #000000;
      font-weight: 900;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      text-decoration: none;
      border-radius: 9999px;
      box-shadow: 0 0 20px rgba(255, 92, 0, 0.5);
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      transform: scale(1.05);
      background: #ff7728;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="card">
    <div class="code">404</div>
    <div class="title">SYSTEM NODE NOT FOUND</div>
    <div class="desc">The requested route or identity portfolio node does not exist.</div>
    <a href="./index.html" class="btn">RETURN TO HOME HUB ↗</a>
  </div>
</body>
</html>
